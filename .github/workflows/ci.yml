name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Sitio (lint · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 7 }

  api:
    name: API de contacto (check + tests)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run check
