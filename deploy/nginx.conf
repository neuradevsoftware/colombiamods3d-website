# Ejemplo para nginx. Ajusta server_name, rutas del certificado y root.
server {
  listen 443 ssl http2;
  server_name colombiamods3d.com www.colombiamods3d.com;
  root /var/www/colombiamods3d/dist;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary text/plain text/markdown;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Link "</.well-known/ai-catalog.json>; rel=\"ai-catalog\"" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://backendmods.colombiamods3d.com; font-src 'self'; connect-src 'self' blob: https://backendmods.colombiamods3d.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'" always;

  # Archivos con hash en el nombre: caché largo
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /.well-known/ { default_type application/json; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /llms.txt { default_type text/markdown; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /models/ { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }

  # URLs limpias: cada ruta sirve su index.html (o el principal)
  location / { try_files $uri $uri/index.html /index.html; }
}
